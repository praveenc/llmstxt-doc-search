text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">add_doc_source /</tspan><tspan x="0" y="16.1">remove_doc_source</tspan></text></g><g class="pele-node pele-shape-diam" data-id="checks" transform="translate(545.51,180.07)"><polygon points="0,-58.07 92.91,0 0,58.07 -92.91,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Input checks</tspan><tspan x="0" y="16.1">pass?</tspan></text></g><g class="pele-node pele-shape-rect stop" data-id="reject" transform="translate(643.19,371.15)"><rect x="-59.34" y="-33" width="118.69" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Rejected</tspan><tspan x="0" y="16.1">(no prompt)</tspan></text></g><g class="pele-node pele-shape-diam" data-id="form" transform="translate(447.83,371.15)"><polygon points="0,-60.01 96.02,0 0,60.01 -96.02,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Client can</tspan><tspan x="0" y="16.1">show a form?</tspan></text></g><g class="pele-node pele-shape-lean-r" data-id="ask" transform="translate(219.57,564.72)"><polygon points="-62.46,-33 78.96,-33 62.46,33 -78.96,33" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Ask the user</tspan><tspan x="0" y="16.1">to confirm</tspan></text></g><g class="pele-node pele-shape-stadium ok" data-id="done" transform="translate(501.64,898.42)"><rect x="-88.25" y="-24" width="176.5" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Registry changed</text></g><g class="pele-node pele-shape-rect stop" data-id="keep" transform="translate(72.07,898.42)"><rect x="-56.69" y="-24" width="113.38" height="48" fill="var(--_s)" stroke="v