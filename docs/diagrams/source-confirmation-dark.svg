<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 719 931" width="719" height="931" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Arial, Helvetica, &quot;Liberation Sans&quot;, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="pele-source-confirmation--title" aria-describedby="pele-source-confirmation--desc"><style>svg.pele{--pele-bg:#0d1117;--pele-fg:#f0f6fc;--pele-muted:#9198a1;--pele-line:#9198a1;--pele-surface:#151b23;--pele-surface-alt:#212830;--pele-border:#3d444d;--pele-accent:#4493f8;--pele-critical:#f85149;--pele-series-1:#4493f8;--pele-series-2:#f0883e;--pele-series-3:#3fb950;--pele-series-4:#f85149;--pele-series-5:#ab7df8;--pele-series-6:#d29922;--pele-series-7:#db61a2;--pele-series-8:#39c5cf;--pele-font:Arial, Helvetica, "Liberation Sans", sans-serif;background:var(--pele-bg)}.pele-node.ok > :first-child { fill: var(--pele-series-3); stroke: var(--pele-series-3); }
.pele-node.ok .pele-label { fill: var(--pele-bg); }
.pele-node.stop > :first-child { stroke: var(--pele-critical); stroke-width: 2px; }</style><title id="pele-source-confirmation--title">When add_doc_source and remove_doc_source change the registry</title><desc id="pele-source-confirmation--desc">Input checks run first and never prompt. A client that can show a form asks the user. Accept changes the registry. Decline makes no change. If the prompt is cancelled, the change happens only with confirm true. A client without forms adds a source directly, but removes a source only with confirm true; otherwise it gets confirmation_required.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_start_checks_0"><path d="M545.51,74L545.51,115"/><path class="pele-marker" d="M545.51,122L542.15,114L548.87,114Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_checks_reject_0"><path d="M561.26,228.3C561.26,243.47 643.19,243.47 643.19,258.64L643.19,331.15"/><path class="pele-marker" d="M643.19,338.15L639.83,330.15L646.55,330.15Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_checks_form_0"><path d="M529.76,228.3C529.76,243.47 447.83,243.47 447.83,258.64L447.83,304.14"/><path class="pele-marker" d="M447.83,311.14L444.47,303.14L451.19,303.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_form_ask_0"><path d="M430.22,420.15C430.22,435.91 219.57,435.91 219.57,451.66L219.57,524.72"/><path class="pele-marker" d="M219.57,531.72L216.21,523.72L222.93,523.72Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_ask_done_0"><path d="M232.87,597.72C232.87,624.88 369.95,624.88 369.95,652.04L369.95,801.42C369.95,831.42 485.39,831.42 485.39,861.42L485.39,867.42"/><path class="pele-marker" d="M485.39,874.42L482.03,866.42L488.75,866.42Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_ask_keep_0"><path d="M200.87,597.72C200.87,624.88 57.18,624.88 57.18,652.04L57.18,867.42"/><path class="pele